name: deploy

on:
  push:
    branches: [main]
    # Alleen de marketingsite. Zonder dit filter deployde elke portal- of
    # agentwijziging de productiesite opnieuw.
    paths:
      - 'Soratus.Web/**'
      - 'Soratus.Web.Tests/**'
      - 'Soratus.slnx'
      - 'NuGet.config'
      - 'Directory.Build.props'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PROJECT: Soratus.Web/Soratus.Web.csproj
  TEST_PROJECT: Soratus.Web.Tests/Soratus.Web.Tests.csproj
  APP_NAME: app-soratus-prod

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Bewust per project in plaats van de hele solution: Soratus.Portal en de
      # agentprojecten mogen de marketing-deploy niet kunnen blokkeren.
      - name: Restore
        run: |
          dotnet restore ${{ env.PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        run: |
          dotnet build ${{ env.PROJECT }} -c Release --no-restore
          dotnet build ${{ env.TEST_PROJECT }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -o ./publish --no-build

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./publish
