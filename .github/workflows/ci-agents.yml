name: ci-agents

# Bouwt en test de agentbibliotheken en het gereedschap eromheen. Bewust géén deploy:
# agents worden per klant uitgerold en er is nog geen klantomgeving die dat kan
# ontvangen. Een workflow die naar een App Service wijst die niet bestaat is een dode
# knop. De MCP-server draait op de machine van een operator en wordt evenmin uitgerold.
#
# Waarom dit los staat van deploy-portal.yml: het portaal verwijst alleen naar
# Soratus.Agents.Contracts, niet naar Telemetry. Een wijziging in de
# telemetriebibliotheek hoort het portaal dus niet te deployen, en een wijziging in
# het portaal hoort deze tests niet te draaien.
#
# Let op bij het toevoegen van een project: deze workflow bouwt projécten en niet de
# solution. Een project in Soratus.slnx zetten dekt het hier dus níet — dat moet met de
# hand, in de paths én in de drie stappen hieronder. Dat is precies zo misgegaan met de
# MCP-server: die stond in de solution en werd door geen enkele pipeline aangeraakt.

on:
  push:
    branches: [main]
    paths:
      - 'Soratus.Agents.Contracts/**'
      - 'Soratus.Agents.Telemetry/**'
      - 'Soratus.Agents.Telemetry.Tests/**'
      - 'Soratus.Agents.AspNetCore/**'
      - 'Soratus.Agents.AspNetCore.Tests/**'
      - 'Soratus.Mcp.Uren/**'
      - 'Soratus.Mcp.Uren.Tests/**'
      - 'agents/**'
      - 'Soratus.slnx'
      - 'NuGet.config'
      - 'Directory.Build.props'
      - '.github/workflows/ci-agents.yml'
  pull_request:
    paths:
      - 'Soratus.Agents.Contracts/**'
      - 'Soratus.Agents.Telemetry/**'
      - 'Soratus.Agents.Telemetry.Tests/**'
      - 'Soratus.Agents.AspNetCore/**'
      - 'Soratus.Agents.AspNetCore.Tests/**'
      - 'Soratus.Mcp.Uren/**'
      - 'Soratus.Mcp.Uren.Tests/**'
      - 'agents/**'
      - 'Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore Soratus.Agents.Contracts/Soratus.Agents.Contracts.csproj
          dotnet restore Soratus.Agents.Telemetry/Soratus.Agents.Telemetry.csproj
          dotnet restore Soratus.Agents.Telemetry.Tests/Soratus.Agents.Telemetry.Tests.csproj
          dotnet restore Soratus.Agents.AspNetCore/Soratus.Agents.AspNetCore.csproj
          dotnet restore Soratus.Agents.AspNetCore.Tests/Soratus.Agents.AspNetCore.Tests.csproj
          dotnet restore agents/heartbeat-demo/heartbeat-demo.csproj
          dotnet restore Soratus.Mcp.Uren/Soratus.Mcp.Uren.csproj
          dotnet restore Soratus.Mcp.Uren.Tests/Soratus.Mcp.Uren.Tests.csproj

      - name: Build
        run: |
          dotnet build Soratus.Agents.Contracts/Soratus.Agents.Contracts.csproj -c Release --no-restore
          dotnet build Soratus.Agents.Telemetry/Soratus.Agents.Telemetry.csproj -c Release --no-restore
          dotnet build Soratus.Agents.Telemetry.Tests/Soratus.Agents.Telemetry.Tests.csproj -c Release --no-restore
          dotnet build Soratus.Agents.AspNetCore/Soratus.Agents.AspNetCore.csproj -c Release --no-restore
          dotnet build Soratus.Agents.AspNetCore.Tests/Soratus.Agents.AspNetCore.Tests.csproj -c Release --no-restore
          dotnet build agents/heartbeat-demo/heartbeat-demo.csproj -c Release --no-restore
          dotnet build Soratus.Mcp.Uren/Soratus.Mcp.Uren.csproj -c Release --no-restore
          dotnet build Soratus.Mcp.Uren.Tests/Soratus.Mcp.Uren.Tests.csproj -c Release --no-restore

      # De referentie-agent bouwt mee omdat hij het bewijs is dat de bibliotheek
      # bruikbaar is. Breekt een wijziging aan de publieke API hem, dan hoort dat
      # hier rood te worden en niet pas bij een uitrol.
      - name: Test
        run: dotnet test Soratus.Agents.Telemetry.Tests/Soratus.Agents.Telemetry.Tests.csproj -c Release --no-build --verbosity normal

      # De ASP.NET Core-laag heeft een eigen teststap en niet een tweede project achter de regel
      # hierboven, om dezelfde reden als de MCP-server hieronder: valt hij om, dan hoort in de
      # uitslag te staan dat het de webhostlaag is. Zijn tests zetten een echte verzoekpijplijn op
      # en meten daarmee twee dingen die alleen dáár bestaan — de metadata van het endpoint dat
      # routing koos, en het moment waarop de endpointlijst gevuld is. Dat tweede is al één keer
      # een gemeten race gebleken.
      - name: Test ASP.NET Core-laag
        run: dotnet test Soratus.Agents.AspNetCore.Tests/Soratus.Agents.AspNetCore.Tests.csproj -c Release --no-build --verbosity normal

      # De MCP-server heeft een eigen teststap en niet een tweede project in de regel
      # hierboven: valt hij om, dan hoort in de uitslag te staan dat het de MCP-server
      # is en niet "de agenttests". Zijn tests dekken onder meer de toolnaam, en die
      # laat bij een fout élke prompt in een sessie falen — zie punt 21.
      - name: Test MCP-server
        run: dotnet test Soratus.Mcp.Uren.Tests/Soratus.Mcp.Uren.Tests.csproj -c Release --no-build --verbosity normal
